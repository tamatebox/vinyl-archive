<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="vinyl-archive">
  <title>vinyl-archive</title>
  <!-- Maskable variant: Android crops to a platform-chosen shape, so the mark
       is inset into the 80% safe zone and only the plate is bled. -->
  <rect width="64" height="64" fill="#16181d"/>
  <g transform="translate(6.4 6.4) scale(0.8)">
    <circle cx="32" cy="32" r="23" fill="none" stroke="#d4a24e" stroke-width="8"/>
    <circle cx="32" cy="32" r="4" fill="#d4a24e"/>
  </g>
</svg>
